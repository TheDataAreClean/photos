name: EmDash deploy

# Deploys emdash/ to Cloudflare Workers. Manual for now; the monthly run
# refreshes the OG image (it's generated at build time, like the Eleventy site).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *'

concurrency:
  group: emdash-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Does nothing until the Cloudflare secrets exist.
    if: ${{ vars.EMDASH_DEPLOY == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # build/og-image.js (and its @napi-rs/canvas) live in the repo root.
      - name: Install root dependencies
        run: npm ci

      - name: Install system fonts
        run: sudo apt-get install -y fonts-open-sans fonts-liberation

      - name: Install EmDash site dependencies
        working-directory: emdash
        run: npm ci

      - name: Generate OG image
        working-directory: emdash
        run: node scripts/gen-og-image.mjs
        env:
          SITE_URL: ${{ vars.EMDASH_SITE_URL }}

      - name: Build and deploy
        working-directory: emdash
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
